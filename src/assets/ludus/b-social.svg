<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360">
  <defs>
    <linearGradient id="socialRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8763f"/>
      <stop offset="1" stop-color="#7c5630"/>
    </linearGradient>
    <linearGradient id="socialBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9d8b4"/>
      <stop offset="1" stop-color="#cbb488"/>
    </linearGradient>
    <linearGradient id="socialToga" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5efe0"/>
      <stop offset="1" stop-color="#d9cba6"/>
    </linearGradient>
  </defs>

  <!-- pediment -->
  <polygon points="40,96 160,30 280,96" fill="url(#socialRoof)"/>
  <rect x="34" y="92" width="252" height="14" fill="#5f4127"/>

  <!-- columns + entablature -->
  <rect x="40" y="106" width="240" height="16" fill="#7c5630"/>
  <g fill="url(#socialBody)">
    <rect x="52" y="122" width="18" height="150"/>
    <rect x="98" y="122" width="18" height="150"/>
    <rect x="144" y="122" width="18" height="150"/>
    <rect x="190" y="122" width="18" height="150"/>
    <rect x="236" y="122" width="18" height="150"/>
  </g>
  <rect x="40" y="266" width="240" height="14" fill="#7c5630"/>

  <!-- steps -->
  <rect x="20" y="280" width="280" height="14" fill="#a8926a"/>
  <rect x="8" y="294" width="304" height="14" fill="#8a7452"/>
  <rect x="0" y="308" width="320" height="14" fill="#6f5c3e"/>

  <!-- toga-clad figure on the steps -->
  <g transform="translate(160,236)">
    <circle cx="0" cy="0" r="12" fill="#e8c9a0"/>
    <path d="M-18,14 C-18,4 -8,-2 0,-2 C8,-2 18,4 18,14 L20,70 C20,78 -20,78 -20,70 Z" fill="url(#socialToga)"/>
    <path d="M-6,-2 L-2,60" stroke="#c9a24a" stroke-width="3" opacity="0.6"/>
  </g>
</svg>
